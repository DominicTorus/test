apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg3-docs-generator
  namespace: tg3-docs-v4
  labels:
    app: tg3-docs-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tg3-docs-generator
  template:
    metadata:
      labels:
        app: tg3-docs-generator
    spec:
      containers:
        - name: torus9x-tdpdocs
          image: 192.168.2.164:5000/tg3-docs-v4:docker_tag
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: tg3-docs-generator
  namespace: tg3-docs-v4
spec:
  selector:
    app: tg3-docs-generator
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
