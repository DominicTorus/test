apiVersion: apps/v1
kind: Deployment
metadata:
  name: a001-docs-generator
  namespace: a001-docs-v1
  labels:
    app: a001-docs-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a001-docs-generator
  template:
    metadata:
      labels:
        app: a001-docs-generator
    spec:
      containers:
        - name: torus9x-tdpdocs
          image: 192.168.2.164:5000/a001-docs-v1:docker_tag
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: a001-docs-generator
  namespace: a001-docs-v1
spec:
  selector:
    app: a001-docs-generator
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
