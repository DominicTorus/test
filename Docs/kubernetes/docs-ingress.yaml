apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a001-docs-v1-ingress
  namespace: a001-docs-v1
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tgadev.toruslowcode.com
      secretName: a001-docs-v1-tls
  rules:
    - host: tgadev.toruslowcode.com
      http:
        paths:
          - path: /ct007/ag001/a001/v1/docs
            pathType: Prefix
            backend:
              service:
                name: a001-docs-generator
                port:
                  number: 3000