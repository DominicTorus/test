apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tg3-docs-v4-ingress
  namespace: tg3-docs-v4
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tgadev.toruslowcode.com
      secretName: tg3-docs-v4-tls
  rules:
    - host: tgadev.toruslowcode.com
      http:
        paths:
          - path: /ct003/cg/tg3/v4/docs
            pathType: Prefix
            backend:
              service:
                name: tg3-docs-generator
                port:
                  number: 3000