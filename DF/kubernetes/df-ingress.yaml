apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ct003-rds001-df-v2-ingress
  namespace: ct003-rds001-df-v2
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tgadev.toruslowcode.com
      secretName: ct003-rds001-df-v2-tls
  rules:
    - host: tgadev.toruslowcode.com
      http:
        paths:
          - path: /ct003/rd001/rds001/v2/api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ct003-rds001-df-generator
                port:
                  number: 443